<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>glitch.video.generator // chaos engine</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="stage"></canvas>

<button id="panelToggle" aria-label="Toggle panel">▣</button>

<aside id="panel">
  <header>
    <h1>GLITCH<span>.</span>VIDEO<span>.</span>GEN</h1>
    <p class="sub">// random chaos compiler</p>
  </header>

  <section>
    <h2>SOURCE</h2>
    <div class="row">
      <label><input type="radio" name="source" value="procedural" checked> procedural</label>
      <label><input type="radio" name="source" value="upload"> upload</label>
      <label><input type="radio" name="source" value="webcam"> webcam</label>
    </div>
    <div id="uploadRow" class="row hidden">
      <input type="file" id="fileInput" accept="image/*,video/*">
    </div>
    <div id="webcamRow" class="row hidden">
      <button id="flipCamBtn" title="Switch front/back camera">⇄ flip cam</button>
    </div>
    <div id="proceduralRow" class="row">
      <select id="proceduralPattern">
        <option value="random">random</option>
        <option value="noise">noise field</option>
        <option value="bars">color bars</option>
        <option value="text">scrolling text</option>
        <option value="grid">grid pulse</option>
        <option value="circles">circles</option>
        <option value="plasma">plasma</option>
      </select>
    </div>
  </section>

  <section>
    <h2>CHAOS</h2>
    <label class="slider">
      <span>intensity</span>
      <input type="range" id="intensity" min="0" max="1" step="0.01" value="0.7">
      <output id="intensityOut">0.70</output>
    </label>
    <label class="slider">
      <span>chaos rate</span>
      <input type="range" id="chaosRate" min="0" max="1" step="0.01" value="0.5">
      <output id="chaosRateOut">0.50</output>
    </label>
    <label class="slider">
      <span>max effects</span>
      <input type="range" id="maxFx" min="1" max="10" step="1" value="4">
      <output id="maxFxOut">4</output>
    </label>
    <div class="row">
      <label class="seed">seed
        <input type="text" id="seed" value="0xCAFEBABE">
      </label>
      <button id="reseed">↻</button>
      <button id="lockChainBtn">lock chain</button>
      <button id="pauseBtn">pause</button>
    </div>
  </section>

  <section>
    <h2>EFFECTS</h2>
    <div class="row">
      <button id="enableAllEffects">enable all</button>
      <button id="disableAllEffects">untoggle all</button>
      <button id="randomizeToggles">rand toggles</button>
      <button id="randomizeParams">rand params</button>
    </div>
    <div id="effectsList" class="effectsList"></div>
  </section>

  <section>
    <h2>RECORD</h2>
    <div class="row">
      <button id="recBtn" class="rec">● REC</button>
      <button id="downloadBtn" disabled>↓ DL</button>
      <button id="exportMp4Btn" disabled>MP4</button>
      <span id="recStatus">idle</span>
    </div>
    <p class="hint">DL = webm. MP4 = in-browser transcode (slower on older phones).</p>
  </section>

  <footer>
    <span id="fps">--- fps</span>
    <span id="activeFx"></span>
  </footer>
</aside>

<script type="module" src="js/main.js"></script>
</body>
</html>
